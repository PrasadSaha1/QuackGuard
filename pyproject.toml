[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quack-guard"
version = "0.2.0"
description = "Content checks and explicit approval for agent tool calls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
llama = ["requests>=2.32,<3"]

[project.urls]
Repository = "https://github.com/PrasadSaha1/QuackGuard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quackguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
